name: Model build

on:
  push:
    branches: [dev]
    paths:
      - "tools/export/**"
      - ".github/workflows/model-build.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL_ID: convaiinnovations/laya-multilingual
      LAYA_REF: 2e4d9c87e8b1621deb344eac7de5c7258f32f849

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU toolchain
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "git+https://github.com/NandhaKishorM/laya.git@${LAYA_REF}"
          python -m pip install --no-cache-dir onnx onnxruntime onnxscript

      - name: Export and package
        run: |
          python tools/export/build_package.py --model "$MODEL_ID" --out dist

      - name: Validate ONNX parity
        run: |
          python tools/export/validate_parity.py \
            --model "$MODEL_ID" \
            --fp32 dist/laya-multilingual-fp32/model.onnx \
            --int8 dist/laya-multilingual-int8/model.onnx \
            --report dist/validation.json

      - name: Write checksums
        run: |
          cd dist
          sha256sum laya-multilingual-fp32.zip laya-multilingual-int8.zip > SHA256SUMS

      - name: Upload INT8 phone package
        uses: actions/upload-artifact@v4
        with:
          name: layaedge-model-int8
          path: |
            dist/laya-multilingual-int8.zip
            dist/validation.json
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error

      - name: Upload FP32 reference package
        uses: actions/upload-artifact@v4
        with:
          name: layaedge-model-fp32-reference
          path: |
            dist/laya-multilingual-fp32.zip
            dist/validation.json
            dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
